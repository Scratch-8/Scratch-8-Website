<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;

    .hint { font-size: 12px; color: #c2c3c7; margin-top: 4px; }
    input, button {
      font-family: inherit;

      box-sizing: border-box;
    }
    input { background: #1d2b53; color: #fff1e8; border: 2px solid #5f574f; }
    button {
      background: #00e436;

    }
    button:hover { background: #ffec27; }
    #log {
      background: #111;
      border: 2px solid #5f574f;

    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SCRATCH-08 Cart Builder</h1>
    <p>Drop in a PICO-8 (<code>.p8</code>) cartridge to build a ready-to-run <code>.sb3</code> file for TurboWarp &amp; Scratch Everywhere.</p>

    <div class="field">
      <label for="p8File">1. Select PICO-8 Cartridge (.p8)</label>
      <input type="file" id="p8File" accept=".p8,.txt" />
    </div>

    <div class="field">
      <label for="baseSb3File">2. Base Runtime (scratch-08.sb3) — Optional if hosted</label>
      <input type="file" id="baseSb3File" accept=".sb3" />
      <div class="hint">Leave blank to auto-fetch <code>./scratch-08.sb3</code>, or pick your local <code>.sb3</code> file directly.</div>
    </div>

    <button id="buildBtn" type="button">Build .sb3 Cartridge</button>
    <div id="log">Initializing...</div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    const BASE_SB3_URL = './scratch-08.sb3';
    const BACKSLASH = String.fromCharCode(92);

    const PICO8_PALETTE = Array.of(
      Array.of(0, 0, 0, 0),
      Array.of(29, 43, 83, 255),
      Array.of(126, 37, 83, 255),
      Array.of(0, 135, 81, 255),
      Array.of(171, 82, 54, 255),
      Array.of(95, 87, 79, 255),
      Array.of(194, 195, 199, 255),
      Array.of(255, 241, 232, 255),
      Array.of(255, 0, 77, 255),
      Array.of(255, 163, 0, 255),
      Array.of(255, 236, 39, 255),
      Array.of(0, 228, 54, 255),
      Array.of(41, 173, 255, 255),
      Array.of(131, 118, 156, 255),
      Array.of(255, 119, 168, 255),
      Array.of(255, 204, 170, 255)
    );

    // Lightweight CRC32 + uncompressed 8x8 RGBA PNG encoder (zero Canvas memory overhead)
    const CRC_TABLE = (function () {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table.set(Array.of(c), n);
      }
      return table;
    })();

    function crc32(buf, start, len) {
      let c = 0xffffffff;
      for (let i = start; i < start + len; i++) {
        const b = buf.subarray(i, i + 1).reduce(function (_, v) { return v; }, 0);
        const idx = (c ^ b) & 0xff;
        const tVal = CRC_TABLE.subarray(idx, idx + 1).reduce(function (_, v) { return v; }, 0);
        c = tVal ^ (c >>> 8);
      }
      return (c ^ 0xffffffff) >>> 0;
    }

    function adler32(buf, start, len) {
      let a = 1;
      let b = 0;
      for (let i = start; i < start + len; i++) {
        const val = buf.subarray(i, i + 1).reduce(function (_, v) { return v; }, 0);
        a = (a + val) % 65521;
        b = (b + a) % 65521;
      }
      return ((b << 16) | a) >>> 0;
    }

    function encode8x8Png(rgbaPixels) {
      // Raw scanlines: 8 rows * (1 filter byte + 32 RGBA bytes) = 264 bytes
      const raw = new Uint8Array(264);
      for (let y = 0; y < 8; y++) {
        raw.set(Array.of(0), y * 33);
        raw.set(rgbaPixels.subarray(y * 32, (y + 1) * 32), y * 33 + 1);
      }

      // Zlib stream with single stored DEFLATE block (2 + 5 + 264 + 4 = 275 bytes)
      const zlib = new Uint8Array(275);
      zlib.set(Array.of(0x78, 0x01, 0x01, 0x08, 0x01, 0xf7, 0xfe), 0);
      zlib.set(raw, 7);
      const adl = adler32(raw, 0, 264);
      const viewZ = new DataView(zlib.buffer);
      viewZ.setUint32(271, adl, false);

      // Total PNG: 8 sig + 25 IHDR + 287 IDAT + 12 IEND = 332 bytes
      const png = new Uint8Array(332);
      const view = new DataView(png.buffer);

      // PNG signature
      png.set(Array.of(137, 80, 78, 71, 13, 10, 26, 10), 0);

      // IHDR chunk (offset 8..32)
      view.setUint32(8, 13, false);
      png.set(Array.of(73, 72, 68, 82), 12);
      view.setUint32(16, 8, false);
      view.setUint32(20, 8, false);
      png.set(Array.of(8, 6, 0, 0, 0), 24);
      view.setUint32(29, crc32(png, 12, 17), false);

      // IDAT chunk (offset 33..319)
      view.setUint32(33, 275, false);
      png.set(Array.of(73, 68, 65, 84), 37);
      png.set(zlib, 41);
      view.setUint32(316, crc32(png, 37, 279), false);

      // IEND chunk (offset 320..331)
      view.setUint32(320, 0, false);
      png.set(Array.of(73, 69, 78, 68), 324);
      view.setUint32(328, crc32(png, 324, 4), false);

      return png;
    }

    function parseP8(text) {
      const sections = { lua: Array.of(), gfx: Array.of(), gff: Array.of(), map: Array.of() };
      let current = null;
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines.slice(i, i + 1).shift().trimEnd();
        if (line === '__lua__') { current = 'lua'; continue; }
        if (line === '__gfx__') { current = 'gfx'; continue; }
        if (line === '__gff__') { current = 'gff'; continue; }
        if (line === '__map__') { current = 'map'; continue; }
        if (line.startsWith('__') && line.endsWith('__')) { current = null; continue; }
        if (current) sections[current].push(line);
      }
      return sections;
    }

    function cleanLua(lines) {
      const cleaned = Array.of();
      let inBlockComment = false;

      for (let l = 0; l < lines.length; l++) {
        const line = lines.slice(l, l + 1).shift();
        let out = '';
        let inQuote = null;

        for (let i = 0; i < line.length; i++) {
          const ch = line.charAt(i);
          const next = line.charAt(i + 1);

          if (inBlockComment) {
            if (ch === ']' && next === ']') {
              inBlockComment = false;
              i++;
            }
            continue;
          }

          if (inQuote) {
            out += ch;
            if (ch === BACKSLASH) {
              out += next || '';
              i++;
            } else if (ch === inQuote) {
              inQuote = null;
            }
            continue;
          }

          if (ch === '"' || ch === "'") {
            inQuote = ch;
            out += ch;
            continue;
          }

          if (ch === '-' && next === '-') {
            if (line.charAt(i + 2) === '[' && line.charAt(i + 3) === '[') {
              inBlockComment = true;
              i += 3;
              continue;
            }
            break;
          }

          if (ch === '/' && next === '/') {
            break;
          }

          out += ch;
        }

        const trimmed = out.trim();
        if (trimmed.length > 0) cleaned.push(trimmed);
      }
      return cleaned;
    }

    async function buildSpriteCostumes(gfxLines, zip) {
      const costumes = Array.of();
      const grid = Array.from({ length: 128 }, function (_, y) {
        const row = gfxLines.slice(y, y + 1).shift() || '';
        return row.padEnd(128, '0');
      });

      const rgbaBuffer = new Uint8Array(256);

      for (let sprIndex = 0; sprIndex < 256; sprIndex++) {
        const sx = (sprIndex % 16) * 8;
        const sy = Math.floor(sprIndex / 16) * 8;

        for (let py = 0; py < 8; py++) {
          const rowStr = grid.slice(sy + py, sy + py + 1).shift();
          for (let px = 0; px < 8; px++) {
            const hexChar = rowStr.charAt(sx + px);
            const colorIdx = parseInt(hexChar, 16) || 0;
            const rgba = PICO8_PALETTE.slice(colorIdx, colorIdx + 1).shift();
            rgbaBuffer.set(rgba, (py * 8 + px) * 4);
          }
        }

        const pngBytes = encode8x8Png(rgbaBuffer);
        const md5 = SparkMD5.ArrayBuffer.hash(pngBytes.buffer);
        const fileName = md5 + '.png';
        zip.file(fileName, pngBytes);

        costumes.push({
          assetId: md5,
          name: 'spr_' + sprIndex,
          bitmapResolution: 1,
          md5ext: fileName,
          dataFormat: 'png',
          rotationCenterX: 0,
          rotationCenterY: 0
        });

        if (sprIndex % 32 === 31) {
          await new Promise(function (resolve) { setTimeout(resolve, 0); });
        }
      }
      return costumes;
    }

    function setScratchList(stage, listName, fallbackId, items) {
      const entries = Object.entries(stage.lists);
      for (let i = 0; i < entries.length; i++) {
        const pair = entries.slice(i, i + 1).shift();
        const id = pair.slice(0, 1).shift();
        const listData = pair.slice(1, 2).shift();
        const existingName = Array.from(listData).shift();
        if (existingName === listName) {
