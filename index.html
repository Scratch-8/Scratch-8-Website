<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRATCH-08 | .p8 to .sb3 Cart Builder</title>
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: #1d2b53;
      color: #fff1e8;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: #000000;
      border: 4px solid #ff004d;
      padding: 24px;
      border-radius: 4px;
    }
    h1 { color: #ffec27; margin-top: 0; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #29adff; font-weight: bold; }
    .hint { font-size: 12px; color: #c2c3c7; margin-top: 4px; }
    input, button {
      font-family: inherit;
      font-size: 15px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    input { background: #1d2b53; color: #fff1e8; border: 2px solid #5f574f; }
    button {
      background: #00e436;
      color: #000000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #ffec27; }
    #log {
      background: #111;
      border: 2px solid #5f574f;
      padding: 12px;
      margin-top: 20px;
      min-height: 100px;
      white-space: pre-wrap;
      font-size: 13px;
      color: #c2c3c7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SCRATCH-08 Cart Builder</h1>
    <p>Drop in a PICO-8 (<code>.p8</code>) cartridge to build a ready-to-run <code>.sb3</code> file for TurboWarp &amp; Scratch Everywhere.</p>

    <div class="field">
      <label for="p8File">1. Select PICO-8 Cartridge (.p8)</label>
      <input type="file" id="p8File" accept=".p8,.txt" />
    </div>

    <div class="field">
      <label for="baseSb3File">2. Base Runtime (scratch-08.sb3) — Optional if hosted</label>
      <input type="file" id="baseSb3File" accept=".sb3" />
      <div class="hint">Leave blank to auto-fetch <code>./scratch-08.sb3</code>, or pick your local <code>.sb3</code> file directly if opening offline.</div>
    </div>

    <button id="buildBtn" type="button">Build .sb3 Cartridge</button>
    <div id="log">Initializing...</div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    const BASE_SB3_URL = './scratch-08.sb3';
    const BACKSLASH = String.fromCharCode(92);

    const PICO8_PALETTE = Array.of(
      Array.of(0, 0, 0, 0),
      Array.of(29, 43, 83, 255),
      Array.of(126, 37, 83, 255),
      Array.of(0, 135, 81, 255),
      Array.of(171, 82, 54, 255),
      Array.of(95, 87, 79, 255),
      Array.of(194, 195, 199, 255),
      Array.of(255, 241, 232, 255),
      Array.of(255, 0, 77, 255),
      Array.of(255, 163, 0, 255),
      Array.of(255, 236, 39, 255),
      Array.of(0, 228, 54, 255),
      Array.of(41, 173, 255, 255),
      Array.of(131, 118, 156, 255),
      Array.of(255, 119, 168, 255),
      Array.of(255, 204, 170, 255)
    );

    function parseP8(text) {
      const sections = { lua: Array.of(), gfx: Array.of(), gff: Array.of(), map: Array.of() };
      let current = null;
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trimEnd();
        if (line === '__lua__') { current = 'lua'; continue; }
        if (line === '__gfx__') { current = 'gfx'; continue; }
        if (line === '__gff__') { current = 'gff'; continue; }
        if (line === '__map__') { current = 'map'; continue; }
        if (line.startsWith('__') && line.endsWith('__')) { current = null; continue; }
        if (current) sections[current].push(line);
      }
      return sections;
    }

    function cleanLua(lines) {
      const cleaned = Array.of();
      let inBlockComment = false;

      for (let l = 0; l < lines.length; l++) {
        const line = lines[l];
        let out = '';
        let inQuote = null;

        for (let i = 0; i < line.length; i++) {
          const ch = line.charAt(i);
          const next = line.charAt(i + 1);

          if (inBlockComment) {
            if (ch === ']' && next === ']') {
              inBlockComment = false;
              i++;
            }
            continue;
          }

          if (inQuote) {
            out += ch;
            if (ch === BACKSLASH) {
              out += next || '';
              i++;
            } else if (ch === inQuote) {
              inQuote = null;
            }
            continue;
          }

          if (ch === '"' || ch === "'") {
            inQuote = ch;
            out += ch;
            continue;
          }

          if (ch === '-' && next === '-') {
            if (line.charAt(i + 2) === '[' && line.charAt(i + 3) === '[') {
              inBlockComment = true;
              i += 3;
              continue;
            }
            break;
          }

          if (ch === '/' && next === '/') {
            break;
          }

          out += ch;
        }

        const trimmed = out.trim();
        if (trimmed.length > 0) cleaned.push(trimmed);
      }
      return cleaned;
    }

    function buildSpriteCostumes(gfxLines, zip) {
      const costumes = Array.of();
      const canvas = document.createElement('canvas');
      canvas.width = 8;
      canvas.height = 8;
      const ctx = canvas.getContext('2d');

      const grid = Array.from({ length: 128 }, function (_, y) {
        const row = gfxLines.slice(y, y + 1).shift() || '';
        return row.padEnd(128, '0');
      });

      for (let sprIndex = 0; sprIndex < 256; sprIndex++) {
        const sx = (sprIndex % 16) * 8;
        const sy = Math.floor(sprIndex / 16) * 8;
        const imgData = ctx.createImageData(8, 8);

        for (let py = 0; py < 8; py++) {
          const rowStr = grid.slice(sy + py, sy + py + 1).shift();
          for (let px = 0; px < 8; px++) {
            const hexChar = rowStr.charAt(sx + px);
            const colorIdx = parseInt(hexChar, 16) || 0;
            const rgba = PICO8_PALETTE.slice(colorIdx, colorIdx + 1).shift();
            const offset = (py * 8 + px) * 4;
            imgData.data.set(rgba, offset);
          }
        }

        ctx.putImageData(imgData, 0, 0);
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.split(',').pop();
        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes.set(Array.of(binaryStr.charCodeAt(i)), i);
        }

        const md5 = SparkMD5.ArrayBuffer.hash(bytes.buffer);
        const fileName = md5 + '.png';
        zip.file(fileName, bytes);

        costumes.push({
          assetId: md5,
          name: 'spr_' + sprIndex,
          bitmapResolution: 1,
          md5ext: fileName,
          dataFormat: 'png',
          rotationCenterX: 0,
          rotationCenterY: 0
        });
      }
      return costumes;
    }

    function setScratchList(stage, listName, fallbackId, items) {
      const entries = Object.entries(stage.lists);
      for (let i = 0; i < entries.length; i++) {
        const id = entries[i].slice(0, 1).shift();
        const listData = entries[i].slice(1, 2).shift();
        const existingName = Array.from(listData).shift();
        if (existingName === listName) {
          stage.lists[id] = Array.of(listName, items);
          return;
        }
      }
      stage.lists[fallbackId] = Array.of(listName, items);
    }

    function getOrCreatePenSprite(projectJson, costumes) {
      let penSprite = projectJson.targets.find(function (t) {
        return !t.isStage && t.name === 'Pen';
      });

      if (!penSprite) {
        const maxLayer = projectJson.targets.reduce(function (max, t) {
          return Math.max(max, t.layerOrder || 0);
        }, 0);

        penSprite = {
          isStage: false,
          name: 'Pen',
          variables: {},
          lists: {},
          broadcasts: {},
          blocks: {},
          comments: {},
          currentCostume: 0,
          costumes: costumes,
          sounds: Array.of(),
          volume: 100,
          layerOrder: maxLayer + 1,
          visible: true,
          x: 0,
          y: 0,
          size: 100,
          direction: 90,
          draggable: false,
          rotationStyle: 'all around'
        };

        projectJson.targets.push(penSprite);
        log('Created new "Pen" sprite target.');
      } else {
        penSprite.costumes = costumes;
        penSprite.currentCostume = 0;
        log('Updated existing "Pen" sprite costumes.');
      }

      return penSprite;
    }

    async function handleBuild() {
      logEl.textContent = 'Button clicked. Checking libraries...';

      if (typeof JSZip === 'undefined' || typeof SparkMD5 === 'undefined') {
        log('Error: JSZip or SparkMD5 failed to load. Check internet connection or VPN/ad blocker.');
        return;
      }

      const p8File = document.getElementById('p8File').files.item(0);
      if (!p8File) {
        log('Error: Please choose a .p8 file in step 1 first.');
        return;
      }

      try {
        log('Reading ' + p8File.name + '...');
        const p8Text = await p8File.text();
        const sections = parseP8(p8Text);
        const cleanedLua = cleanLua(sections.lua);
        log('Parsed ' + cleanedLua.length + ' lines of cleaned PICO-8 Lua.');

        let sb3Buffer;
        const manualSb3 = document.getElementById('baseSb3File').files.item(0);
        if (manualSb3) {
          log('Using selected base runtime (' + manualSb3.name + ')...');
          sb3Buffer = await manualSb3.arrayBuffer();
        } else {
          log('Fetching base runtime (' + BASE_SB3_URL + ')...');
          const res = await fetch(BASE_SB3_URL);
