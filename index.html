<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>.p8 to .sb3 Remaster Converter</title>
  <script src="https://cloudflare.com"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #1d2b53;
      --card: #29366f;
      --accent: #ff004d;
      --accent-hover: #ff77a8;
      --text: #fff1e8;
      --muted: #c2c3c7;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body {
      margin: 0; padding: 24px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 600px; background: var(--card);
      border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
    .dropzone {
      border: 2px dashed #5f574f; border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: 0.2s; background: rgba(0,0,0,0.15);
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--accent-hover); background: rgba(255,0,77,0.1); }
    input[type="file"] { display: none; }
    .options {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    select {
      background: #1d2b53; color: var(--text); border: 1px solid #5f574f;
      border-radius: 8px; padding: 10px; font-size: 0.95rem;
    }
    button {
      width: 100%; background: var(--accent); color: white; border: none;
      border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:not(:disabled):hover { background: #e00043; }
    #log {
      margin-top: 16px; background: #000; color: #00e436; padding: 12px;
      border-radius: 8px; font-size: 0.8rem; max-height: 180px; overflow-y: auto;
      white-space: pre-wrap; display: none;
    }
    .preview-grid {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px;
      background: #000; padding: 10px; border-radius: 8px; max-height: 160px; overflow-y: auto;
    }
    .preview-grid img { image-rendering: pixelated; width: 32px; height: 32px; border: 1px solid #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>.p8 &rarr; .sb3 Remaster Converter</h1>
    <p>Auto-loads <code>./testrom.p8</code> on startup, or tap below to choose your own cartridge.</p>

    <div class="dropzone" id="dropzone">
      <strong id="fileLabel">Loading ./testrom.p8...</strong>
      <input type="file" id="fileInput" accept=".p8,.txt" />
    </div>

    <div class="options">
      <label>
        Sprite Export Scale
        <select id="scaleSelect">
          <option value="1">1x (8&times;8 Original)</option>
          <option value="4" selected>4x (32&times;32 Crisp)</option>
          <option value="8">8x (64&times;64 HD Base)</option>
        </select>
      </label>
      <label>
        Transparent Color
        <select id="transColor">
          <option value="0" selected>0 - Black (#000000)</option>
          <option value="-1">None (Opaque)</option>
        </select>
      </label>
    </div>

    <button id="convertBtn" disabled>Convert &amp; Download .sb3</button>
    <div class="preview-grid" id="previewGrid" style="display:none;"></div>
    <div id="log"></div>
  </div>

  <script>
    const PICO8_PALETTE = [,  ,  ,  ,
 ,  ,  , [255, 241, 232],
,  ,  ,  [0, 228, 54],
,  [131, 118, 156], [255, 119, 168], [255, 204, 170]
    ];

    let loadedText = "";
    let fileName = "testrom";

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const convertBtn = document.getElementById("convertBtn");
    const logEl = document.getElementById("log");
    const previewGrid = document.getElementById("previewGrid");

    function log(msg) {
      logEl.style.display = "block";
      logEl.textContent += msg + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function loadCartText(text, name) {
      loadedText = text;
      fileName = name.replace(/\.[^/.]+$/, "");
      document.getElementById("fileLabel").textContent = "Loaded: " + name + " (Tap to swap)";
      convertBtn.disabled = false;
      logEl.textContent = "";
      log("Ready: " + name + " (" + loadedText.length + " bytes)");
    }

    // Auto-fetch ./testrom.p8 on page load
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("./testrom.p8");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        loadCartText(text, "testrom.p8");
      } catch (err) {
        document.getElementById("fileLabel").textContent = "Tap to select or drop a .p8 file";
        log("Could not auto-load ./testrom.p8 (" + err.message + "). Select a .p8 manually.");
      }
    });

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => loadCartText(e.target.result, file.name);
      reader.readAsText(file);
    }

    function parseP8(text) {
      const sections = { lua: "", gfx: "", gff: "", map: "", sfx: "", music: "" };
      let current = null;
      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trimEnd();
        const match = line.match(/^__(lua|gfx|gff|map|sfx|music)__$/);
        if (match) {
          current = match[1];
        } else if (current) {
          sections[current] += rawLine + "\n";
        }
      }
      return sections;
    }

    function extractSprites(gfxText, scale, transIdx) {
      const lines = gfxText.trim().split(/\r?\n/).filter(Boolean);
      const grid = Array.from({ length: 128 }, () => new Uint8Array(128));
      for (let y = 0; y < Math.min(128, lines.length); y++) {
        for (let x = 0; x < Math.min(128, lines[y].length); x++) {
          grid[y][x] = parseInt(lines[y][x], 16) || 0;
        }
      }

      const sprites = [];
      const canvas = document.createElement("canvas");
      canvas.width = 8 * scale;
      canvas.height = 8 * scale;
      const ctx = canvas.getContext("2d");

      for (let idx = 0; idx < 128; idx++) {
        const sx = (idx % 16) * 8;
        const sy = Math.floor(idx / 16) * 8;
        let hasPixels = false;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let py = 0; py < 8; py++) {
          for (let px = 0; px < 8; px++) {
            const c = grid[sy + py][sx + px];
            if (c !== transIdx) {
              hasPixels = true;
              const [r, g, b] = PICO8_PALETTE[c];
              ctx.fillStyle = `rgb(${r},${g},${b})`;
              ctx.fillRect(px * scale, py * scale, scale, scale);
            }
          }
        }

        if (hasPixels || idx === 0) {
          const dataUrl = canvas.toDataURL("image/png");
          const base64 = dataUrl.split(",")[1];
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const md5 = SparkMD5.ArrayBuffer.hash(bytes.buffer);
          sprites.push({ idx, md5, bytes, dataUrl });
        }
      }
      return sprites;
    }

    function parseMapRows(mapText) {
      const lines = mapText.trim().split(/\r?\n/).filter(Boolean);
      const rows = [];
      for (let y = 0; y < Math.min(32, lines.length); y++) {
        const rowTiles = [];
        for (let x = 0; x < Math.min(128, Math.floor(lines[y].length / 2)); x++) {
          const hexByte = lines[y].substr(x * 2, 2);
          rowTiles.push(parseInt(hexByte, 16) || 0);
        }
        rows.push(rowTiles.join(","));
      }
      return rows;
    }

    function createBlankPng() {
      const c = document.createElement("canvas");
      c.width = 1; c.height = 1;
      const base64 = c.toDataURL("image/png").split(",")[1];
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return { md5: SparkMD5.ArrayBuffer.hash(bytes.buffer), bytes };
    }

    convertBtn.addEventListener("click", async () => {
      convertBtn.disabled = true;
      logEl.textContent = "";
      previewGrid.innerHTML = "";
      previewGrid.style.display = "flex";

      const scale = parseInt(document.getElementById("scaleSelect").value, 10);
      const transIdx = parseInt(document.getElementById("transColor").value, 10);

      log("1/4 Extracting __lua__, __gfx__, and __map__...");
