<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRATCH-08 | .p8 to .sb3 Cart Builder</title>
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;

      background: #00e436;

<body>
  <div class="card">
    <h1>SCRATCH-08 Cart Builder</h1>
    <p>Drop in a PICO-8 (<code>.p8</code>) cartridge to build a ready-to-run <code>.sb3</code> file for TurboWarp &amp; Scratch Everywhere.</p>

    <div class="field">
      <label for="p8File">1. Select PICO-8 Cartridge (.p8)</label>
      <input type="file" id="p8File" accept=".p8,.txt" />
    </div>

    <div class="field">
      <label for="baseSb3File">2. Base Runtime (scratch-08.sb3) — Optional if hosted</label>
      <input type="file" id="baseSb3File" accept=".sb3" />
      <div class="hint">Leave blank to auto-fetch <code>./scratch-08.sb3</code>, or pick your local <code>.sb3</code> file directly if opening offline.</div>
    </div>

    <button id="buildBtn">Build .sb3 Cartridge</button>
    <div id="log">Ready. Waiting for .p8 file...</div>
  </div>

  <script>
    const BASE_SB3_URL = './scratch-08.sb3';

    const PICO8_PALETTE = Array.of(
      Array.of(0, 0, 0, 0),         // 0: Black (Transparent for sprites)
      Array.of(29, 43, 83, 255),    // 1: Dark Blue
      Array.of(126, 37, 83, 255),   // 2: Dark Purple
      Array.of(0, 135, 81, 255),    // 3: Dark Green
      Array.of(171, 82, 54, 255),   // 4: Brown
      Array.of(95, 87, 79, 255),    // 5: Dark Grey
      Array.of(194, 195, 199, 255), // 6: Light Grey
      Array.of(255, 241, 232, 255), // 7: White
      Array.of(255, 0, 77, 255),    // 8: Red
      Array.of(255, 163, 0, 255),   // 9: Orange
      Array.of(255, 236, 39, 255),  // a: Yellow
      Array.of(0, 228, 54, 255),    // b: Green
      Array.of(41, 173, 255, 255),  // c: Blue
      Array.of(131, 118, 156, 255), // d: Lavender
      Array.of(255, 119, 168, 255), // e: Pink
      Array.of(255, 204, 170, 255)  // f: Peach
    );

    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    function parseP8(text) {
      const sections = { lua: Array.of(), gfx: Array.of(), gff: Array.of(), map: Array.of() };
      let current = null;
      for (const rawLine of text.split(/\r?\n/)) {
        const line = rawLine.trimEnd();
        if (line === '__lua__') { current = 'lua'; continue; }
        if (line === '__gfx__') { current = 'gfx'; continue; }
        if (line === '__gff__') { current = 'gff'; continue; }
        if (line === '__map__') { current = 'map'; continue; }
        if (line.startsWith('__') && line.endsWith('__')) { current = null; continue; }
        if (current) sections[current].push(line);
      }
      return sections;
    }

    function cleanLua(lines) {
      const cleaned = Array.of();
      let inBlockComment = false;

      for (const line of lines) {
        let out = '';
        let inQuote = null;

        for (let i = 0; i < line.length; i++) {
          const ch = line.charAt(i);
          const next = line.charAt(i + 1);

          if (inBlockComment) {
            if (ch === ']' && next === ']') {
              inBlockComment = false;
              i++;
            }
            continue;
          }

          if (inQuote) {
            out += ch;
            if (ch === '\\') {
              out += next || '';
              i++;
            } else if (ch === inQuote) {
              inQuote = null;
            }
            continue;
          }

          if (ch === '"' || ch === "'") {
            inQuote = ch;
            out += ch;
            continue;
          }

          if (ch === '-' && next === '-') {
            if (line.charAt(i + 2) === '[' && line.charAt(i + 3) === '[') {
              inBlockComment = true;
              i += 3;
              continue;
            }
            break;
          }

          if (ch === '/' && next === '/') {
            break;
          }

          out += ch;
        }

        const trimmed = out.trim();
        if (trimmed.length > 0) cleaned.push(trimmed);
      }
      return cleaned;
    }

    function buildSpriteCostumes(gfxLines, zip) {
      const costumes = Array.of();
      const canvas = document.createElement('canvas');
      canvas.width = 8;
      canvas.height = 8;
      const ctx = canvas.getContext('2d');

      const grid = Array.from({ length: 128 }, (_, y) =>
        (gfxLines.at(y) || '').padEnd(128, '0')
      );

      for (let sprIndex = 0; sprIndex < 256; sprIndex++) {
        const sx = (sprIndex % 16) * 8;
        const sy = Math.floor(sprIndex / 16) * 8;
        const imgData = ctx.createImageData(8, 8);

        for (let py = 0; py < 8; py++) {
          for (let px = 0; px < 8; px++) {
            const hexChar = grid.at(sy + py).charAt(sx + px);
            const colorIdx = parseInt(hexChar, 16) || 0;
            const rgba = PICO8_PALETTE.at(colorIdx);
            const offset = (py * 8 + px) * 4;
            imgData.data.set(rgba, offset);
          }
        }

        ctx.putImageData(imgData, 0, 0);
        const dataUrl = canvas.toDataURL('image/png');
        const base64 = dataUrl.split(',').at(1);
        const binaryStr = atob(base64);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes.set(Array.of(binaryStr.charCodeAt(i)), i);
        }

        const md5 = SparkMD5.ArrayBuffer.hash(bytes.buffer);
        const fileName = `${md5}.png`;
        zip.file(fileName, bytes);

        costumes.push({
          assetId: md5,
          name: `spr_${sprIndex}`,
          bitmapResolution: 1,
          md5ext: fileName,
          dataFormat: 'png',
          rotationCenterX: 0,
          rotationCenterY: 0
        });
      }
      return costumes;
    }

    function setScratchList(stage, listName, fallbackId, items) {
      for (const [id, listData] of Object.entries(stage.lists)) {
        if (listData.at(0) === listName) {
          stage.lists[id] = Array.of(listName, items);
          return;
        }
      }
      stage.lists[fallbackId] = Array.of(listName, items);
    }

    function getOrCreatePenSprite(projectJson, costumes) {
      let penSprite = projectJson.targets.find(t => !t.isStage && t.name === 'Pen');

      if (!penSprite) {
        const maxLayer = projectJson.targets.reduce(
          (max, t) => Math.max(max, t.layerOrder || 0),
          0
        );

        penSprite = {
          isStage: false,
          name: 'Pen',
          variables: {},
          lists: {},
          broadcasts: {},
          blocks: {},
          comments: {},
          currentCostume: 0,
          costumes: costumes,
          sounds: Array.of(),
          volume: 100,
          layerOrder: maxLayer + 1,
          visible: true,
          x: 0,
          y: 0,
          size: 100,
          direction: 90,
          draggable: false,
          rotationStyle: 'all around'
        };

        projectJson.targets.push(penSprite);
        log('Created new "Pen" sprite target.');
      } else {
        penSprite.costumes = costumes;
        penSprite.currentCostume = 0;
        log('Updated existing "Pen" sprite costumes.');
      }

      return penSprite;
    }

    document.getElementById('buildBtn').addEventListener('click', async () => {
      if (typeof JSZip === 'undefined' || typeof SparkMD5 === 'undefined') {
        logEl.textContent = 'Error: JSZip or SparkMD5 failed to load. Check your internet connection or ad blocker.';
        return;
      }

      const p8File = document.getElementById('p8File').files.item(0);
      if (!p8File) {
        logEl.textContent = 'Error: Please choose a .p8 file first.';
        return;
      }

      try {
        logEl.textContent = `Reading ${p8File.name}...`;
        const p8Text = await p8File.text();
        const sections = parseP8(p8Text);
        const cleanedLua = cleanLua(sections.lua);
        log(`Parsed ${cleanedLua.length} lines of cleaned PICO-8 Lua.`);

        let sb3Buffer;
        const manualSb3 = document.getElementById('baseSb3File').files.item(0);
        if (manualSb3) {
          log(`Using selected base runtime (${manualSb3.name})...`);
          sb3Buffer = await manualSb3.arrayBuffer();
        } else {
          log(`Fetching base runtime (${BASE_SB3_URL})...`);
          const res = await fetch(BASE_SB3_URL);
          if (!res.ok) {
            throw new Error(`Could not auto-load ${BASE_SB3_URL} (HTTP ${res.status}). Select scratch-08.sb3 in input #2 above.`);
          }
          sb3Buffer = await res.arrayBuffer();
        }
